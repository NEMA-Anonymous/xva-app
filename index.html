<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a1f1a"><meta name="apple-mobile-web-app-capable" content="yes">
<!-- v2-pwa -->
<title>EAT CAKE-U · X desk</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="X desk"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍰</text></svg>">
<style>
:root{--bg:#fbf6f0;--card:#fff;--ink:#2a1f1a;--mut:#7a6a5f;--acc:#d9634c;--ok:#3f8f5a;--line:#eadfd4;--warn:#fff3d6}
@media(prefers-color-scheme:dark){:root{--bg:#1b1512;--card:#2a211c;--ink:#f5ece4;--mut:#b8a698;--acc:#f08a6c;--ok:#6cc58a;--line:#3d312a;--warn:#3a2f17}}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 0;z-index:5}
h1{margin:0 0 8px;font-size:20px}nav{display:flex;gap:6px}
nav button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;flex:1;min-height:44px;border:0;background:none;color:var(--mut);font-weight:600;border-bottom:3px solid transparent;font-size:15px}
nav button.on{color:var(--acc);border-color:var(--acc)}
main{max-width:640px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.meta{font-size:13px;color:var(--mut)}.orig{border-left:3px solid var(--line);padding-left:10px;margin:8px 0;white-space:pre-wrap}
textarea,input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px}
textarea{min-height:90px}.cnt{text-align:right;font-size:13px;color:var(--mut)}.cnt.over{color:#d33;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{cursor:pointer;touch-action:manipulation;-webkit-appearance:none;flex:1 1 auto;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px system-ui}
.p{background:var(--acc);color:#fff;border:0}.g{background:var(--ok);color:#fff;border:0}.big{min-height:56px;font-size:17px;flex:1 1 40%}
.warn{background:var(--warn);border-radius:8px;padding:8px;font-size:13px;margin:6px 0}
.chk{background:#ffd84d;color:#2a1f1a;font-weight:700;border-radius:8px;padding:6px 10px;margin:6px 0;display:inline-block}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--line);margin-right:6px;text-transform:uppercase}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}.empty{text-align:center;color:var(--mut);padding:30px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;opacity:0;transition:.2s;pointer-events:none}
#toast.s{opacity:1}
#cf{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}#cf.s{display:flex}#cf .card{width:100%;max-width:560px}#cf textarea{min-height:180px;-webkit-user-select:text;user-select:text}
</style></head><body>
<script>
/* ===================== DRAFTS — paste assistant output here =====================
   Fields: id, type ('mention'|'dm'|'post'), from, original, draft, link, created,
           needs_review (optional bool).
   Drafts are AUTO-APPROVED by default. Set needs_review:true for anything about
   money/payments, links to new people, or suspected scam accounts — those stay
   in Review with a yellow "check this one" badge. */
const DATA_VER = 'real-2026-10-12';
const DRAFTS = [
 {id:'2107080069051294192',type:'mention',from:'@AmeliaMarg17',original:'@RaphaelMor55653 Hello 👋',draft:'hey partner, hello back 👋 thanks for stopping by, hope your day is sweet 🍰 — EAT CAKE-U',link:'https://x.com/i/status/2107080069051294192',created:'2026-10-05T12:06:50Z',needs_review:true,flag:'Brand-new account (Jul 2026, 7 followers) with a classic romance-scam style bio. Reply publicly only; never move to DMs.'},
 {id:'2106971918259953836',type:'mention',from:'@grace96236171',original:'@RaphaelMor55653 @luna_baylee0 Let\u2019s do something',draft:'haha hey partner, appreciate the shoutout 🍌 keep an ear out for more EAT CAKE-U music, have a good one',link:'https://x.com/i/status/2106971918259953836',created:'2026-10-05T04:57:05Z',needs_review:true,flag:'Mass-tagging account (follows 3.5k). Possibly spam. Your call.'}
];
/* =================================== END DRAFTS ================================= */
</script>
<header><h1>🍰 EAT CAKE-U · X desk</h1>
<nav><button type="button" data-t="review" class="on">Review</button><button type="button" data-t="inbox">Inbox</button><button type="button" data-t="approved">Approved</button></nav></header>
<main id="m"></main><div id="toast"></div>
<div id="cf"><div class="card"><b>Copy this text</b><div class="meta">Automatic copy was blocked — long-press / select all and copy.</div><textarea id="cft" readonly></textarea><div class="row"><button type="button" type="button" class="btn p" id="cfc">Close</button></div></div></div>
<script>
(function(){
const LS='xdesk_v2';let st;try{for(const k of Object.keys(localStorage))if(/example/i.test(k))localStorage.removeItem(k);localStorage.removeItem('xdesk_v1');st=JSON.parse(localStorage.getItem(LS)||'null')}catch(_){}
if(!st||typeof st!=='object')st={};st.s=st.s||{};st.e=st.e||{};st.req=Array.isArray(st.req)?st.req:[];st.del=Array.isArray(st.del)?st.del:[];if(st.ver!==DATA_VER){st.ver=DATA_VER}
for(const k in st.s)if(/^example-/.test(k))delete st.s[k];for(const k in st.e)if(/^example-/.test(k))delete st.e[k];
st.req=st.req.filter(r=>r&&!/^EXAMPLE/.test(r.msg||''));
const LIVE=()=>DRAFTS.filter(d=>!st.del.includes(d.id));
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(st))}catch(_){toast('Could not save (private mode?)')}};
const $=s=>document.querySelector(s),m=$('#m');let tab='approved';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('s');setTimeout(()=>e.classList.remove('s'),1400)}
function showCopy(t){$('#cft').value=t;$('#cf').classList.add('s');setTimeout(()=>{const x=$('#cft');x.focus();x.select();try{x.setSelectionRange(0,t.length)}catch(_){}},50)}
function legacyCopy(t){let ok=false;const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px';document.body.appendChild(a);a.focus();a.select();try{a.setSelectionRange(0,t.length)}catch(_){}try{ok=document.execCommand('copy')}catch(_){ok=false}a.remove();return ok}
function copy(t){const done=ok=>{if(ok)toast('Copied');else showCopy(t)};
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>done(true),()=>done(legacyCopy(t)))}else done(legacyCopy(t))}
// status: explicit choice wins; otherwise auto-approve unless needs_review
const S=d=>(d.id in st.s)?st.s[d.id]:(d.needs_review?'':'ok');
const txt=d=>st.e[d.id]!=null?st.e[d.id]:d.draft;
const SAFE='<div class="warn">⚠️ DM safety: never send photos · never send money · watch for scam / celebrity‑impersonator accounts.</div>';
function card(d,rev){const t=txt(d),n=[...t].length;return `<div class="card" data-id="${esc(d.id)}">
<div class="meta"><span class="tag">${esc(d.type)}</span>${d.type==='post'?'New post':'Reply to <b>'+esc(d.from)+'</b>'} · ${esc((d.created||'').slice(0,16).replace('T',' '))}</div>
${d.needs_review?'<div class="chk">🟡 Check this one</div>':''}${d.flag?'<div class="warn">'+esc(d.flag)+'</div>':''}${d.type==='dm'?SAFE:''}${d.original?`<div class="orig">${esc(d.original)}</div>`:''}
<textarea>${esc(t)}</textarea><div class="cnt${n>280?' over':''}">${n}/280</div>
<div class="row"><button type="button" class="btn p big" data-a="copy">📋 Copy</button><button type="button" class="btn p big" data-a="open">↗ Open on X</button></div>
<div class="row">${rev?'<button type="button" class="btn g" data-a="ok">Approve</button><button type="button" class="btn" data-a="skip">Skip</button>':'<button type="button" class="btn" data-a="undo">Move to Review</button>'}<button type="button" class="btn" data-a="del">Delete</button></div></div>`}
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 const q=LIVE().filter(d=>!S(d)),ap=LIVE().filter(d=>S(d)==='ok'),sk=LIVE().filter(d=>S(d)==='skip').length;
 $('nav [data-t=review]').textContent='Review'+(q.length?' ('+q.length+')':'');
 $('nav [data-t=approved]').textContent='Approved'+(ap.length?' ('+ap.length+')':'');
 if(tab==='review'){
  m.innerHTML=(q.length?`<div class="row" style="margin-bottom:12px"><button type="button" class="btn g big" id="aa">✓ Approve all (${q.length})</button></div>`+q.map(d=>card(d,1)).join(''):(LIVE().length?'<div class="empty">Nothing to check 🎉</div>':'<div class="empty">🍰 All clear, partner! No drafts right now.<br>Paste a message in <b>Inbox</b> to get started.</div>'))+(sk?`<div class="row"><button type="button" class="btn" id="rs">Restore ${sk} skipped</button></div>`:'');}
 else if(tab==='approved'){
  m.innerHTML=(ap.length?`<div class="row" style="margin-bottom:12px"><button type="button" class="btn" id="ea">Export approved (${ap.length})</button></div>`+ap.map(d=>card(d,0)).join(''):(LIVE().length?'<div class="empty">Nothing approved yet.</div>':'<div class="empty">No drafts yet. Paste a message in <b>Inbox</b> to get started.</div>'));}
 else{const p=st.req.filter(r=>!r.done);
  m.innerHTML=`<div class="card"><b>Paste a DM or mention</b>
<label>From handle</label><input id="fh" placeholder="@handle" autocapitalize="off">
<label>Type</label><select id="ft"><option value="mention">Mention</option><option value="dm">DM</option></select>
<label>Message text</label><textarea id="fm"></textarea>
<label>Tone (optional)</label><select id="fo"><option value="">—</option><option>warm</option><option>funny</option><option>short</option><option>decline</option></select>
<input id="fn" placeholder="Extra note (optional)" style="margin-top:8px">
<div class="row"><button type="button" class="btn p" id="sv">Save</button></div></div>
${p.length?`<div class="row" style="margin-bottom:12px"><button type="button" class="btn p" id="ex">Export all pending (${p.length})</button></div>`:''}
${st.req.slice().reverse().map(r=>`<div class="card" data-r="${r.id}"><div class="meta"><span class="tag">${esc(r.type)}</span><b>${esc(r.from)}</b>${r.tone?' · '+esc(r.tone):''}${r.done?' · ✓ sent':''}</div>${r.type==='dm'?SAFE:''}<div class="orig">${esc(r.msg)}</div>${r.note?`<div class="meta">Note: ${esc(r.note)}</div>`:''}
<div class="row"><button type="button" class="btn" data-a="rc">Copy for assistant</button><button type="button" class="btn" data-a="rd">${r.done?'Mark pending':'Mark sent'}</button><button type="button" class="btn" data-a="rx">Delete</button></div></div>`).join('')||'<div class="empty">No requests yet.</div>'}`;}
}
const block=r=>`DRAFT REQUEST\nType: ${r.type}\nFrom: ${r.from}\nMessage: ${r.msg}\nTone: ${r.tone||'any'}${r.note?'\nNote: '+r.note:''}`;
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.t;render();window.scrollTo(0,0)}));
$('#cfc').addEventListener('click',()=>$('#cf').classList.remove('s'));
m.addEventListener('input',e=>{const c=e.target.closest('.card');if(e.target.tagName==='TEXTAREA'&&c&&c.dataset.id){st.e[c.dataset.id]=e.target.value;save();const n=[...e.target.value].length,k=c.querySelector('.cnt');k.textContent=n+'/280';k.classList.toggle('over',n>280)}});
m.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const c=b.closest('.card'),a=b.dataset.a;
 if(b.id==='aa'){LIVE().filter(d=>!S(d)).forEach(d=>st.s[d.id]='ok');save();toast('All approved');return render()}
 if(b.id==='rs'){for(const k in st.s)if(st.s[k]==='skip')st.s[k]='';save();return render()}
 if(b.id==='ea')return copy(LIVE().filter(d=>S(d)==='ok').map(d=>`[${d.type}] ${d.type==='post'?'POST':'→ '+d.from}${d.link?' ('+d.link+')':''}\n${txt(d)}`).join('\n\n---\n\n'));
 if(b.id==='ex')return copy(st.req.filter(r=>!r.done).map(block).join('\n\n'));
 if(b.id==='sv'){const r={id:Date.now(),from:$('#fh').value.trim(),type:$('#ft').value,msg:$('#fm').value.trim(),tone:$('#fo').value,note:$('#fn').value.trim()};
  if(!r.msg)return toast('Add message text');if(r.from&&r.from[0]!=='@')r.from='@'+r.from;st.req.push(r);save();toast('Saved');return render()}
 if(c&&c.dataset.r){const i=st.req.findIndex(r=>r.id==c.dataset.r),r=st.req[i];
  if(a==='rc')copy(block(r));if(a==='rd'){r.done=!r.done;save();render()}if(a==='rx'&&confirm('Delete?')){st.req.splice(i,1);save();render()}return}
 if(!c||!c.dataset.id)return;const d=DRAFTS.find(x=>x.id===c.dataset.id);
 if(a==='copy')copy(txt(d));
 if(a==='open'){const u=(d.type!=='post'&&/^\d+$/.test(d.id))?'https://x.com/i/status/'+d.id:d.link||(d.type==='post'?'https://x.com/compose/post?text='+encodeURIComponent(txt(d)):'https://x.com/'+String(d.from||'').replace('@',''));const w=window.open(u,'_blank');if(w)try{w.opener=null}catch(_){}else location.href=u}
 if(a==='ok'||a==='skip'){st.s[d.id]=a;save();toast(a==='ok'?'Approved':'Skipped');render()}
 if(a==='del'&&confirm('Delete this draft?')){st.del.push(d.id);save();toast('Deleted');render()}
 if(a==='undo'){st.s[d.id]='';save();render()}
});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
tab='review';if(!LIVE().length)tab='review';else if(!LIVE().some(d=>!S(d)))tab='approved';
save();render();
})();
</script></body></html>
